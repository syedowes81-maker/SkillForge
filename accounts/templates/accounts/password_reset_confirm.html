{% extends "accounts/base.html" %}

{% block content %}

<h2>Set New Password</h2>

{% if validlink %}

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Change Password
        </button>

    </form>

{% else %}

    <p>
        This password reset link is invalid or has expired.
    </p>

    <a href="{% url 'password_reset' %}">
        Request a new reset link
    </a>

{% endif %}

{% endblock %}
