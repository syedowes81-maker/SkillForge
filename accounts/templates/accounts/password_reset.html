{% extends "accounts/base.html" %}

{% block content %}

<h2>Reset Password</h2>

<p>
    Enter the email address associated with your SkillForge account.
</p>

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Send Reset Link
    </button>

</form>

<p>
    <a href="{% url 'login' %}">
        ← Back to Login
    </a>
</p>

{% endblock %}
